[project]
name = "trading-bot-phase15-controlled-live-deployment"
version = "0.15.0"
description = "Phase 15 controlled live deployment framework for an institutional trading bot"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.7",
  "websockets>=12.0",
  "prometheus-client>=0.20",
  "fastapi>=0.111",
  "uvicorn>=0.30",
  "PyYAML>=6.0",
  "httpx>=0.27",
]

[project.optional-dependencies]

storage = [
  "httpx>=0.27",
  "asyncpg>=0.29",
]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "jsonschema>=4.0",
  "orjson>=3.10",
]
streaming = [
  "aiokafka>=0.10",
]

[tool.pytest.ini_options]
pythonpath = ["libs/python", "services/market_data/python", "services/order_book/python", "services/storage/python", "services/features/python", "services/liquidity/python", "services/sweep/python", "services/avwap/python", "services/signals/python", "services/backtest/python", "services/risk/python", "services/paper_execution/python", "services/monitoring/python", "services/live_execution/python", "services/deployment/python"]
testpaths = ["tests", "services/market_data/python/tests", "services/order_book/python/tests", "services/storage/python/tests", "services/features/python/tests", "services/liquidity/python/tests", "services/sweep/python/tests", "services/avwap/python/tests", "services/backtest/python/tests", "services/risk/python/tests", "services/paper_execution/python/tests", "services/monitoring/python/tests", "services/live_execution/python/tests", "services/deployment/python/tests"]

[tool.ruff]
line-length = 100

