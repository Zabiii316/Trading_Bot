[project]
name = "trading-bot"
version = "1.0.0-alpha"
description = "Deterministic Binance USD-M futures trading system with enforced backtest/live parity"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.7",
  "websockets>=12.0",
  "prometheus-client>=0.20",
  "fastapi>=0.111",
  "uvicorn>=0.30",
  "PyYAML>=6.0",
  "httpx>=0.27",
]

[project.optional-dependencies]

storage = [
  "httpx>=0.27",
  "asyncpg>=0.29",
]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "jsonschema>=4.0",
  "orjson>=3.10",
]
streaming = [
  "aiokafka>=0.10",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "RUF"]
# UP042 (StrEnum): the 20+ enums in trading_contracts use (str, Enum) and are
# serialised on the wire with those semantics. New enums match them rather than
# splitting the codebase across two conventions. Revisit as one migration.
ignore = ["UP042"]

[tool.ruff.lint.per-file-ignores]
"ops/cli/*" = ["E402"]
"services/*" = ["ALL"]      # legacy tree; lifted per-module during Phase 2

[tool.mypy]
python_version = "3.11"
strict = true
files = ["core", "adapters"]

