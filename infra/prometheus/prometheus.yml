global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

scrape_configs:
  - job_name: trading-monitoring-api
    metrics_path: /metrics
    static_configs:
      - targets:
          - monitoring-api:8080

  - job_name: redpanda
    metrics_path: /metrics
    static_configs:
      - targets:
          - redpanda:9644
